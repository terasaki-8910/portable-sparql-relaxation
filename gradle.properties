# Gradle properties for this project.
#
# No JDK location is configured here on purpose. Gradle uses the JDK found via
# the JAVA_HOME environment variable (or `java` on PATH). That JDK must be
# Java 21: build.gradle requests a Java 21 toolchain and the prebuilt jar in
# build/libs/ contains class files for Java 21 (class-file version 65).
#
# Example (macOS/Linux):  export JAVA_HOME=/path/to/jdk-21
# Example (Windows):      set JAVA_HOME=C:\path\to\jdk-21
#
# If you prefer to pin the JDK for Gradle only, add a line of the form
#   org.gradle.java.home=/path/to/jdk-21
# to your *user-level* ~/.gradle/gradle.properties rather than to this file.
